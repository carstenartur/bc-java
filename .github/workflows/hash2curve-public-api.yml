name: Hash2curve public API experiment
on:
  push:
    branches: ['research/hash2curve-public-api']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    env:
      JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build identical-core comparison
        run: |
          git fetch --no-tags --depth=1 origin ab16374d37c7e18c4090eb8838ebbd72a92593f2
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g :core:classes
          python3 research/hash2curve-public-api/prepare.py
          python3 -m unittest discover -s research/hash2curve-public-api -v
          git rev-parse HEAD > research/hash2curve-public-api/evidence/checkout.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Exact API validation and fixed JMH pairs
        run: python3 research/hash2curve-public-api/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-api-java${{ matrix.java }}-${{ github.run_id }}
          path: |
            research/hash2curve-public-api/evidence/
            research/hash2curve-public-api/target/benchmarks.jar
            research/hash2curve-public-api/lib/baseline.jar
            research/hash2curve-public-api/lib/optimized.jar
          if-no-files-found: error
