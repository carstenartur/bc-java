name: Hash2curve constants

on:
  pull_request:
    paths:
      - 'core/src/**/org/bouncycastle/crypto/hash2curve/**'
      - 'research/hash2curve-constants/**'
      - '.github/workflows/hash2curve-constants.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BC_TEST_DATA_HOME: ${{ github.workspace }}/bc-test-data
      JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bcgit/bc-test-data
          path: bc-test-data
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Hash-to-curve suite (including constant and operation-count tests)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source.txt
          java -version 2>&1 | tee evidence/java.txt
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g :core:test --tests org.bouncycastle.crypto.hash2curve.test.AllTests 2>&1 | tee evidence/focused.log
      - name: Preserve actual test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hash2curve-focused-${{ github.run_id }}
          path: |
            evidence/
            core/build/test-results/
            core/build/reports/tests/
          if-no-files-found: error
